<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Tracker - List Page</title>
    <link rel="stylesheet" href="styles.css">
    <style>


    </style>
</head>
<body>

<nav>
    <div class="container nav-content">
        <div class="nav-links">
            <a href="index.html">Main Page</a>
            <a href="list.html">List Page</a>
        </div>
        <input type="text" class="search-bar" placeholder="Search movies..." aria-label="Search movies">
    </div>
</nav>

<div class="container">

    <header class="hero">
        <h1>Recent Releases</h1>
    </header>

    <section class="shelf-section">
        <div class="shelf-title">Action</div>
        <div class="dvd-row">
            <div class="dvd-spine spine-green" tabindex="0">Movie Title</div>
            <div class="dvd-spine spine-orange" tabindex="0">Movie Title</div>
            <div class="dvd-spine spine-blue" tabindex="0">Movie Title</div>
            <div class="dvd-spine spine-pink" tabindex="0">Movie Title</div>
            <div class="dvd-spine spine-black" tabindex="0">Movie Title</div>
            <div class="dvd-spine spine-red" tabindex="0">Movie Title</div>
        </div>
    </section>

    <section class="shelf-section">
        <div class="shelf-title">Comedy</div>
        <div class="dvd-row">
            <div class="dvd-spine spine-empty"></div>
        </div>
    </section>

    <section class="shelf-section">
        <div class="shelf-title">Horror</div>
        <div class="dvd-row">
            <div class="dvd-spine spine-empty"></div>
        </div>
    </section>

</div>

</body>
</html>
